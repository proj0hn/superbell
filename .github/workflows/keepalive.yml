# 배포한 Streamlit 앱이 미사용으로 잠들지 않도록 6시간마다 헬스체크를 호출합니다.
name: keepalive

on:
  schedule:
    # 6시간마다 (UTC 기준 00:17 / 06:17 / 12:17 / 18:17)
    # 정각은 러너가 몰려 지연되므로 17분에 실행합니다.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          URL="https://superbell-auto-counter.streamlit.app"
          # /healthz 는 Streamlit이 제공하는 헬스체크 엔드포인트 → {"status":"ok"}
          code=$(curl -sSL -o /tmp/body -w "%{http_code}" --max-time 90 "$URL/healthz")
          echo "healthz: $code / $(cat /tmp/body)"
          # 앱 본문도 한 번 열어 실제 트래픽으로 기록되게 합니다.
          curl -sSL -o /dev/null -w "root: %{http_code}\n" --max-time 90 "$URL/"
          test "$code" = "200"
